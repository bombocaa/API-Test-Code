$kind: http-request
url: "{{baseUrl}}/booking/{{bookingId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstname": "Updated Guest",
      "lastname": "API Test",
      "totalprice": 200,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2027-06-10",
        "checkout": "2027-06-15"
      },
      "additionalneeds": "Breakfast and late checkout"
    }
scripts:
  - type: afterResponse
    code: pm.test('Update without authentication is forbidden', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/booking/{{bookingId}}"
method: PUT
headers:
  Content-Type: application/json
  Cookie: token={{token}}
body:
  type: json
  content: |-
    {
      "firstname": "Updated Guest",
      "lastname": "API Test",
      "totalprice": 200,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2027-06-10",
        "checkout": "2027-06-15"
      },
      "additionalneeds": "Breakfast and late checkout"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Booking is updated', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('Updated values are returned', function () { pm.expect(body.firstname).to.eql('Updated Guest'); pm.expect(body.totalprice).to.eql(200); pm.expect(body.additionalneeds).to.eql('Breakfast and late checkout'); });
    language: text/javascript
order: 4000
